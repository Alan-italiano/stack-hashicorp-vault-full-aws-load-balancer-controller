name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DESTROY" para confirmar a destruição de toda a infraestrutura'
        required: true
        type: string

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TOFU_VERSION:    "1.8.3"
  KUBECTL_VERSION: "v1.30.9"
  AWS_REGION:      "us-east-1"
  CLUSTER_NAME:    "vault-eks-lab"
  TF_STATE_KEY:    "vault-eks-alb-lab/terraform.tfstate"

jobs:
  destroy:
    name: Plan & Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 0. Validação de segurança ─────────────────────────────────────────
      - name: Validate confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "DESTROY" ]]; then
            echo "Confirmação inválida. Você deve digitar exatamente DESTROY para prosseguir."
            exit 1
          fi

      # ── 1. Checkout + ferramentas ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # ── 2. Credenciais AWS ────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Terraform Init ─────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -upgrade
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 4. Captura status do cluster e VPC ID ────────────────────────────
      # Feito antes de qualquer deleção para que os outputs estejam disponíveis
      # em todos os passos seguintes, mesmo após o cluster ser removido.
      - name: Get cluster info
        id: cluster
        run: |
          CLUSTER_STATUS=$(timeout 20 aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          VPC_ID=$(timeout 20 aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${{ env.CLUSTER_NAME }}" \
              --query "Vpcs[0].VpcId" \
              --output text 2>/dev/null || echo "")
          fi

          echo "cluster_status=$CLUSTER_STATUS" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$VPC_ID"                 >> "$GITHUB_OUTPUT"
          echo "Cluster: $CLUSTER_STATUS | VPC: $VPC_ID"

      # ── 5. Pré-destroy: limpa recursos K8s que criam AWS LBs ──────────────
      # Este passo é best-effort (continue-on-error + timeout 3min).
      # Objetivo: sinalizar ao LB Controller para remover ALBs/NLBs via API
      # Kubernetes antes de pré-deletarmos os nodes (passo 8).
      #
      # Problemas tratados:
      # - Finalizer "group.ingress.k8s.aws/*" nos Ingresses
      #   → kubectl delete trava aguardando limpeza AWS que nunca vem
      # - Finalizer "elbv2.k8s.aws/resources" nos TargetGroupBindings
      #   → namespace fica em Terminating quando controller está sem conectividade
      # - Finalizer "service.k8s.aws/resources" nos LoadBalancer Services
      #   → kubectl delete trava
      #
      # Se o cluster não estiver ACTIVE ou o kubectl travar, continue-on-error
      # garante que o workflow avance — os LBs são removidos via AWS CLI no
      # passo seguinte e todos os recursos k8s saem do state no passo 10.
      - name: Pre-destroy - remove K8s LB resources and finalizers
        continue-on-error: true
        timeout-minutes: 3
        run: |
          CLUSTER_STATUS="${{ steps.cluster.outputs.cluster_status }}"
          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "Cluster não está ACTIVE ($CLUSTER_STATUS) — pulando kubectl."
            exit 0
          fi

          timeout 30 aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" || {
            echo "Falha ao configurar kubeconfig — pulando kubectl."
            exit 0
          }

          # Remove finalizers de todos os TargetGroupBindings.
          # O LB Controller cria TGBs em cada namespace para os backends ALB/NLB.
          # Com nodes mortos, o controller não consegue remover os finalizers →
          # a namespace fica em Terminating para sempre.
          for NS in vault monitoring postgres cert-manager external-dns kube-system; do
            for TGB in $(timeout 15 kubectl get targetgroupbinding \
                -n "$NS" -o name 2>/dev/null || true); do
              echo "  TGB finalizer: $TGB ($NS)"
              timeout 10 kubectl patch "$TGB" -n "$NS" \
                -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
              timeout 10 kubectl delete "$TGB" -n "$NS" \
                --ignore-not-found 2>/dev/null || true
            done
          done

          # Remove finalizers e deleta Ingresses e LoadBalancer Service.
          for NS_NAME_KIND in \
            "vault:vault-alb:ingress" \
            "monitoring:grafana-alb:ingress" \
            "postgres:postgres-service:service"; do
            NS="${NS_NAME_KIND%%:*}"
            REST="${NS_NAME_KIND#*:}"
            NAME="${REST%%:*}"
            KIND="${REST##*:}"
            timeout 10 kubectl patch "$KIND/$NAME" -n "$NS" \
              -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
            timeout 10 kubectl delete "$KIND/$NAME" -n "$NS" \
              --ignore-not-found 2>/dev/null || true
          done

          echo "Recursos Kubernetes processados."

      # ── 6. Force-delete LBs e Target Groups na VPC ────────────────────────
      # Se o cluster estava ACTIVE, aguarda até 3min pelo LB Controller limpar
      # os ALBs/NLBs acionados no passo anterior. Se o cluster já está gone,
      # não há controller rodando — força deleção imediata sem espera.
      - name: Pre-destroy - force delete all LBs and Target Groups
        run: |
          VPC_ID="${{ steps.cluster.outputs.vpc_id }}"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC não encontrada — sem LBs para limpar."
            exit 0
          fi

          CLUSTER_STATUS="${{ steps.cluster.outputs.cluster_status }}"

          if [ "$CLUSTER_STATUS" = "ACTIVE" ]; then
            echo "Aguardando até 3min pelo LB Controller limpar ALBs/NLBs..."
            for i in $(seq 1 12); do
              COUNT=$(aws elbv2 describe-load-balancers \
                --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" \
                --output text 2>/dev/null || echo "0")
              if [ "${COUNT:-0}" -eq "0" ]; then
                echo "Nenhum LB na VPC."
                break
              fi
              echo "  ${COUNT} LB(s) ainda presentes — aguardando 15s... ($i/12)"
              sleep 15
            done
          fi

          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")

          if [ -n "$LB_ARNS" ]; then
            for ARN in $LB_ARNS; do
              echo "  Forçando deleção LB: $ARN"
              aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" || true
            done
            echo "Aguardando 90s para ENIs dos LBs serem liberadas..."
            sleep 90
          fi

          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" \
            --output text 2>/dev/null || echo "")
          for TG_ARN in $TG_ARNS; do
            echo "  Deletando Target Group: $TG_ARN"
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          done

      # ── 7. Remove SGs órfãos do LB Controller ────────────────────────────
      # O LB Controller cria SGs com nome "k8s-*" fora do Terraform.
      # Eles adicionam regras cross-SG no node SG (elbv2.k8s.aws/targetGroupBinding)
      # que impedem a deleção dos SGs gerenciados pelo EKS → VPC não pode ser
      # destruída (DependencyViolation).
      - name: Pre-destroy - delete orphaned LB Controller security groups
        run: |
          VPC_ID="${{ steps.cluster.outputs.vpc_id }}"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC não encontrada — pulando limpeza de SGs."
            exit 0
          fi

          ORPHAN_SGS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?starts_with(GroupName,'k8s-')].GroupId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$ORPHAN_SGS" ]; then
            echo "Nenhum SG órfão do LB Controller encontrado."
            exit 0
          fi

          # Revoga regras cross-SG em todos os SGs EKS que referenciam os órfãos
          EKS_SGS=$(aws ec2 describe-security-groups \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=tag:aws:eks:cluster-name,Values=${{ env.CLUSTER_NAME }}" \
            --query "SecurityGroups[*].GroupId" \
            --output text 2>/dev/null || echo "")

          for EKS_SG in $EKS_SGS; do
            for ORPHAN_SG in $ORPHAN_SGS; do
              RULE_IDS=$(aws ec2 describe-security-group-rules \
                --filters "Name=group-id,Values=$EKS_SG" \
                --query "SecurityGroupRules[?ReferencedGroupInfo.GroupId=='$ORPHAN_SG'].SecurityGroupRuleId" \
                --output text 2>/dev/null || echo "")
              for RULE_ID in $RULE_IDS; do
                echo "  Revogando regra $RULE_ID em $EKS_SG → $ORPHAN_SG"
                aws ec2 revoke-security-group-ingress \
                  --group-id "$EKS_SG" \
                  --security-group-rule-ids "$RULE_ID" 2>/dev/null || true
              done
            done
          done

          for SG in $ORPHAN_SGS; do
            SG_NAME=$(aws ec2 describe-security-groups --group-ids "$SG" \
              --query "SecurityGroups[0].GroupName" --output text 2>/dev/null || echo "?")
            echo "  Deletando SG: $SG ($SG_NAME)"
            aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
          done

      # ── 8. Pré-deleta EKS node groups e aguarda ENIs liberarem ────────────
      # Sem isso: Terraform destrói o node group → EC2 encerra instâncias →
      # ENIs ainda presentes nas subnets → Terraform tenta deletar as subnets
      # imediatamente → DependencyViolation.
      # Com "aws eks wait nodegroup-deleted", as instâncias estão terminadas
      # e as ENIs liberadas antes do Terraform chegar na VPC.
      - name: Pre-destroy - delete EKS node groups and wait
        run: |
          NODE_GROUPS=$(aws eks list-nodegroups \
            --cluster-name "${{ env.CLUSTER_NAME }}" \
            --query "nodegroups[]" \
            --output text 2>/dev/null || echo "")

          if [ -z "$NODE_GROUPS" ]; then
            echo "Nenhum node group encontrado — pulando."
            exit 0
          fi

          for NG in $NODE_GROUPS; do
            echo "Deletando node group: $NG"
            aws eks delete-nodegroup \
              --cluster-name "${{ env.CLUSTER_NAME }}" \
              --nodegroup-name "$NG" 2>/dev/null \
              || echo "  Ignorado (já deletado ou erro)."
          done

          echo "Aguardando conclusão da deleção (timeout: 30min)..."
          for NG in $NODE_GROUPS; do
            echo "  Aguardando: $NG"
            aws eks wait nodegroup-deleted \
              --cluster-name "${{ env.CLUSTER_NAME }}" \
              --nodegroup-name "$NG" 2>/dev/null \
              || echo "  $NG já inexistente."
          done

          echo "Todos os node groups deletados. ENIs das instâncias liberadas."

      # ── 9. Remove volumes EBS órfãos de PVCs ─────────────────────────────
      # Com o EBS CSI Driver morto (nodes deletados), os volumes das PVCs
      # não são deletados automaticamente. Eles ficam como "available" (custo
      # residual) mas não bloqueiam a VPC. Limpamos preventivamente aqui.
      - name: Pre-destroy - delete orphaned EBS volumes from PVCs
        run: |
          VOL_IDS=$(aws ec2 describe-volumes \
            --filters \
              "Name=tag:kubernetes.io/cluster/${{ env.CLUSTER_NAME }},Values=owned" \
              "Name=status,Values=available" \
            --query "Volumes[*].VolumeId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$VOL_IDS" ]; then
            echo "Nenhum volume EBS órfão encontrado."
            exit 0
          fi

          for VOL_ID in $VOL_IDS; do
            echo "  Deletando volume EBS: $VOL_ID"
            aws ec2 delete-volume --volume-id "$VOL_ID" 2>/dev/null || true
          done
          echo "Volumes EBS órfãos removidos."

      # ── 10. Remove recursos Kubernetes/Helm do Terraform state ────────────
      # Com os nodes deletados, todos os controllers morrem (LB Controller,
      # EBS CSI Driver, Prometheus Operator etc.). Se o tofu destroy tentar
      # destruir kubernetes_namespace ou helm_release, o provider aguarda
      # finalizers que nunca serão removidos → "context deadline exceeded".
      #
      # Solução: remove TODOS os recursos kubernetes_*, helm_release.* e
      # kubectl_manifest.* do state. O destroy opera apenas sobre recursos AWS
      # (EKS control plane, VPC, IAM, KMS, S3, WAF, ACM, Route53) via API,
      # sem precisar dos controllers k8s. O etcd e todos os objetos k8s são
      # destruídos automaticamente com o control plane do EKS.
      - name: Remove Kubernetes and Helm resources from Terraform state
        run: |
          K8S_ADDRS=$(tofu state list 2>/dev/null \
            | grep -E '^(kubernetes_|helm_release\.|kubectl_manifest\.)' || true)
          if [ -n "$K8S_ADDRS" ]; then
            echo "$K8S_ADDRS" | while read -r addr; do
              echo "  Removendo do state: $addr"
              tofu state rm "$addr" || true
            done
          else
            echo "Nenhum recurso kubernetes_*/helm_release no state."
          fi

          NG_ADDRS=$(tofu state list 2>/dev/null \
            | grep 'aws_eks_node_group' || true)
          if [ -n "$NG_ADDRS" ]; then
            echo "$NG_ADDRS" | while read -r addr; do
              echo "  Removendo node group do state: $addr"
              tofu state rm "$addr" || true
            done
          fi
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 11. Terraform Plan -destroy ───────────────────────────────────────
      - name: Terraform Plan (destroy)
        run: |
          tofu plan \
            -destroy \
            -var-file=terraform.tfvars.ci \
            -out=destroy.tfplan \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Publish destroy plan summary
        run: |
          {
            echo "### Recursos que serão DESTRUÍDOS — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo '```'
            grep -E "(#|will be destroyed|Plan:)" plan_output.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 12. Terraform Destroy ─────────────────────────────────────────────
      - name: Terraform Destroy
        run: tofu apply -auto-approve destroy.tfplan
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Destroy completed
        run: |
          {
            echo "### Destroy concluído em $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Toda a infraestrutura foi removida com sucesso."
          } >> "$GITHUB_STEP_SUMMARY"
