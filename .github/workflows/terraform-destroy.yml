name: Terraform Destroy

# Execução apenas manual — sem agendamento automático.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DESTROY" para confirmar a destruição de toda a infraestrutura'
        required: true
        type: string

# Evita execuções paralelas que corrompem o state.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TOFU_VERSION:    "1.8.3"
  KUBECTL_VERSION: "v1.30.9"
  AWS_REGION:      "us-east-1"
  CLUSTER_NAME:    "vault-eks-lab"
  TF_STATE_KEY:    "vault-eks-alb-lab/terraform.tfstate"

jobs:
  destroy:
    name: Plan & Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 0. Validação de segurança ─────────────────────────────────────────
      - name: Validate confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "DESTROY" ]]; then
            echo "Confirmação inválida. Você deve digitar exatamente DESTROY para prosseguir."
            exit 1
          fi
          echo "Confirmação aceita. Prosseguindo com o destroy."

      # ── 1. Código ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Ferramentas ────────────────────────────────────────────────────
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # ── 3. Credenciais AWS ────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. Verifica que o bucket de state existe ──────────────────────────
      - name: Verify Terraform state bucket exists
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "ERRO: bucket de state '$BUCKET' não encontrado."
            exit 1
          fi
          echo "Bucket $BUCKET encontrado."

      # ── 5. Terraform Init ─────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -upgrade
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 6. Pré-destroy: remove recursos K8s que criam AWS LBs ─────────────
      # Os Ingress (ALB) e o postgres LoadBalancer Service criam recursos AWS
      # fora do controle direto do Terraform. Se esses LBs ainda existirem
      # quando o Terraform tentar destruir a VPC, as subnets e o IGW ficam
      # bloqueados por ENIs pendentes (DependencyViolation).
      #
      # Estratégia:
      #   1. Deletar via kubectl para acionar o controller (caminho limpo)
      #   2. Aguardar o controller remover os LBs da AWS
      #   3. Se restarem LBs após o timeout, forçar deleção via AWS CLI
      #   4. Remover do Terraform state para que o destroy não tente gerenciá-los
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Pre-destroy - delete Ingress and LoadBalancer Service via kubectl
        run: |
          kubectl delete ingress vault-alb    -n vault      --ignore-not-found
          kubectl delete ingress grafana-alb  -n monitoring --ignore-not-found
          kubectl delete service postgres-service -n postgres --ignore-not-found
          echo "Recursos Kubernetes deletados."

      - name: Pre-destroy - wait for AWS LBs to be removed by the controller
        run: |
          VPC_ID=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "Cluster/VPC não encontrado — sem LBs para aguardar."
            exit 0
          fi

          echo "VPC: $VPC_ID — aguardando remoção dos LBs (até 5min)..."
          DEADLINE=$((SECONDS + 300))
          while [ $SECONDS -lt $DEADLINE ]; do
            COUNT=$(aws elbv2 describe-load-balancers \
              --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" \
              --output text 2>/dev/null || echo "0")
            [ "$COUNT" -eq 0 ] && echo "Todos os LBs foram removidos pelo controller." && exit 0
            echo "  $COUNT LB(s) ainda existem. Aguardando 15s..."
            sleep 15
          done
          echo "Timeout — prosseguindo para força deleção via AWS CLI."

      - name: Pre-destroy - force delete remaining LBs and target groups via AWS CLI
        run: |
          VPC_ID=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "Cluster/VPC não encontrado — nada a forçar."
            exit 0
          fi

          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")

          if [ -z "$LB_ARNS" ]; then
            echo "Nenhum LB restante na VPC."
            exit 0
          fi

          for ARN in $LB_ARNS; do
            echo "Force-deleting LB: $ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" || true
          done

          # Aguarda os LBs serem removidos para liberar os target groups
          echo "Aguardando 60s para LBs serem removidos..."
          sleep 60

          # Remove target groups órfãos na VPC
          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" \
            --output text 2>/dev/null || echo "")

          for TG_ARN in $TG_ARNS; do
            echo "Deleting target group: $TG_ARN"
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          done

          # Aguarda ENIs serem liberadas
          echo "Aguardando 30s para ENIs serem liberadas..."
          sleep 30

      # ── 7. Remove recursos deletados do Terraform state ───────────────────
      # Evita que o `tofu destroy` falhe com "still exists" em recursos que
      # já foram removidos manualmente nos passos anteriores.
      - name: Remove pre-deleted resources from Terraform state
        run: |
          tofu state rm kubernetes_ingress_v1.vault   || true
          tofu state rm kubernetes_ingress_v1.grafana || true
          tofu state rm kubernetes_service_v1.postgres || true
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 8. Terraform Plan -destroy ────────────────────────────────────────
      - name: Terraform Plan (destroy)
        run: |
          tofu plan \
            -destroy \
            -var-file=terraform.tfvars.ci \
            -out=destroy.tfplan \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Publish destroy plan summary
        run: |
          {
            echo "### Recursos que serão DESTRUÍDOS — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            grep -E "(#|will be destroyed|Plan:)" plan_output.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 9. Terraform Destroy ──────────────────────────────────────────────
      - name: Terraform Destroy
        run: tofu apply -auto-approve destroy.tfplan
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Destroy completed
        run: |
          {
            echo "### Destroy concluído em $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Toda a infraestrutura foi removida."
          } >> "$GITHUB_STEP_SUMMARY"
