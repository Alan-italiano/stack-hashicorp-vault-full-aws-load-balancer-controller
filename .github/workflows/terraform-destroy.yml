name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DESTROY" para confirmar a destruição de toda a infraestrutura'
        required: true
        type: string

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TOFU_VERSION:    "1.8.3"
  KUBECTL_VERSION: "v1.30.9"
  AWS_REGION:      "us-east-1"
  CLUSTER_NAME:    "vault-eks-lab"
  TF_STATE_KEY:    "vault-eks-alb-lab/terraform.tfstate"

jobs:
  destroy:
    name: Plan & Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 0. Validação de segurança ─────────────────────────────────────────
      - name: Validate confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "DESTROY" ]]; then
            echo "Confirmação inválida. Você deve digitar exatamente DESTROY para prosseguir."
            exit 1
          fi

      # ── 1. Checkout + ferramentas ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # ── 2. Credenciais AWS ────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Terraform Init ─────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -upgrade
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 4. Captura VPC ID antes de qualquer destroy ───────────────────────
      # Feito aqui enquanto o state ainda existe — usado nos passos de cleanup.
      - name: Get VPC ID from Terraform state
        id: vpc
        run: |
          # Tenta via EKS (mais confiável se o cluster ainda existir)
          VPC_ID=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text 2>/dev/null || echo "")

          # Fallback: busca pelo nome da VPC nas tags do Terraform
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${{ env.CLUSTER_NAME }}" \
              --query "Vpcs[0].VpcId" \
              --output text 2>/dev/null || echo "")
          fi

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "VPC ID: $VPC_ID"

      # ── 5. Pré-destroy: remove K8s resources que criam AWS LBs ───────────
      - name: Pre-destroy - delete Ingress and LoadBalancer Service via kubectl
        run: |
          if aws eks describe-cluster --name "${{ env.CLUSTER_NAME }}" \
               --query "cluster.status" --output text 2>/dev/null | grep -q ACTIVE; then
            aws eks update-kubeconfig \
              --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"
            kubectl delete ingress vault-alb      -n vault      --ignore-not-found || true
            kubectl delete ingress grafana-alb    -n monitoring --ignore-not-found || true
            kubectl delete service postgres-service -n postgres --ignore-not-found || true
            echo "Recursos Kubernetes deletados."
          else
            echo "Cluster EKS não acessível — pulando kubectl delete."
          fi

      # ── 6. Force-delete todos os LBs na VPC e aguarda ENIs liberarem ──────
      - name: Pre-destroy - force delete all LBs in VPC
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC não encontrada — sem LBs para limpar."
            exit 0
          fi

          # Aguarda até 3min pelo controller antes de forçar
          echo "Aguardando até 3min pelo AWS LB Controller..."
          DEADLINE=$((SECONDS + 180))
          while [ $SECONDS -lt $DEADLINE ]; do
            COUNT=$(aws elbv2 describe-load-balancers \
              --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" \
              --output text 2>/dev/null || echo "0")
            [ "$COUNT" -eq "0" ] && echo "Nenhum LB na VPC." && exit 0
            echo "  $COUNT LB(s) ainda presentes. Aguardando 15s..."
            sleep 15
          done

          # Força deleção de todos os LBs na VPC
          echo "Forçando deleção de todos os LBs na VPC..."
          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")

          for ARN in $LB_ARNS; do
            echo "  Deletando: $ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" || true
          done

          # Aguarda ENIs serem liberadas
          echo "Aguardando 90s para ENIs serem liberadas..."
          sleep 90

          # Remove target groups órfãos
          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" \
            --output text 2>/dev/null || echo "")
          for TG_ARN in $TG_ARNS; do
            echo "  Deletando target group: $TG_ARN"
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          done

      # ── 7. Remove recursos pre-deletados do Terraform state ───────────────
      - name: Remove pre-deleted resources from Terraform state
        run: |
          tofu state rm kubernetes_ingress_v1.vault    || true
          tofu state rm kubernetes_ingress_v1.grafana  || true
          tofu state rm kubernetes_service_v1.postgres || true
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 8. Terraform Plan -destroy ────────────────────────────────────────
      - name: Terraform Plan (destroy)
        run: |
          tofu plan \
            -destroy \
            -var-file=terraform.tfvars.ci \
            -out=destroy.tfplan \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Publish destroy plan summary
        run: |
          {
            echo "### Recursos que serão DESTRUÍDOS — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo '```'
            grep -E "(#|will be destroyed|Plan:)" plan_output.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 9. Terraform Destroy ──────────────────────────────────────────────
      - name: Terraform Destroy
        run: tofu apply -auto-approve destroy.tfplan
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Destroy completed
        run: |
          {
            echo "### Destroy concluído em $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Toda a infraestrutura foi removida."
          } >> "$GITHUB_STEP_SUMMARY"
