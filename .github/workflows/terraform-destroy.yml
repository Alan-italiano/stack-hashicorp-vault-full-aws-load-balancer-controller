name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DESTROY" para confirmar a destruição de toda a infraestrutura'
        required: true
        type: string

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TOFU_VERSION:    "1.8.3"
  KUBECTL_VERSION: "v1.30.9"
  AWS_REGION:      "us-east-1"
  CLUSTER_NAME:    "vault-eks-lab"
  TF_STATE_KEY:    "vault-eks-alb-lab/terraform.tfstate"

jobs:
  destroy:
    name: Plan & Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 0. Validação de segurança ─────────────────────────────────────────
      - name: Validate confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "DESTROY" ]]; then
            echo "Confirmação inválida. Você deve digitar exatamente DESTROY para prosseguir."
            exit 1
          fi

      # ── 1. Checkout + ferramentas ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # ── 2. Credenciais AWS ────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Terraform Init ─────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -upgrade
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 4. Captura VPC ID antes de qualquer destroy ───────────────────────
      - name: Get VPC ID
        id: vpc
        run: |
          VPC_ID=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${{ env.CLUSTER_NAME }}" \
              --query "Vpcs[0].VpcId" \
              --output text 2>/dev/null || echo "")
          fi

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "VPC ID: $VPC_ID"

      # ── 5. Pré-destroy: remove K8s resources que criam AWS LBs ───────────
      # Timeout de 3min + continue-on-error para evitar travamento:
      # kubectl e aws eks update-kubeconfig podem pendurar indefinidamente se
      # o cluster estiver em DELETING ou com webhooks do LB Controller inativos.
      # Os ALBs são removidos via AWS CLI direto no passo 6 de qualquer forma.
      - name: Pre-destroy - delete Ingress and LoadBalancer Service via kubectl
        continue-on-error: true
        timeout-minutes: 3
        run: |
          CLUSTER_STATUS=$(timeout 20 aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" \
            --query "cluster.status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Cluster status: $CLUSTER_STATUS"

          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "Cluster não está ACTIVE — pulando kubectl."
            exit 0
          fi

          timeout 30 aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" || exit 0

          # Remove finalizers de TargetGroupBindings (criados pelo LB Controller)
          # e dos Ingresses/Services para evitar namespace Terminating stuck.
          for NS in vault monitoring postgres cert-manager external-dns kube-system; do
            for TGB in $(timeout 10 kubectl get targetgroupbinding -n "$NS" -o name 2>/dev/null); do
              echo "  Removendo finalizer de $TGB em $NS"
              timeout 10 kubectl patch "$TGB" -n "$NS" \
                -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
              timeout 10 kubectl delete "$TGB" -n "$NS" \
                --ignore-not-found 2>/dev/null || true
            done
          done

          for RESOURCE in \
            "ingress/vault-alb::vault" \
            "ingress/grafana-alb::monitoring" \
            "service/postgres-service::postgres"; do
            NAME=$(echo "$RESOURCE" | cut -d: -f1)
            NS=$(echo "$RESOURCE" | cut -d: -f3)
            timeout 10 kubectl patch "$NAME" -n "$NS" \
              -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
            timeout 10 kubectl delete "$NAME" -n "$NS" \
              --ignore-not-found 2>/dev/null || true
          done

          echo "Recursos Kubernetes processados."

      # ── 6. Force-delete LBs na VPC e aguarda ENIs liberarem ───────────────
      - name: Pre-destroy - force delete all LBs in VPC
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC não encontrada — sem LBs para limpar."
            exit 0
          fi

          echo "Aguardando até 3min pelo AWS LB Controller..."
          DEADLINE=$((SECONDS + 180))
          while [ $SECONDS -lt $DEADLINE ]; do
            COUNT=$(aws elbv2 describe-load-balancers \
              --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" \
              --output text 2>/dev/null || echo "0")
            [ "$COUNT" -eq "0" ] && echo "Nenhum LB na VPC." && break
            echo "  $COUNT LB(s) ainda presentes. Aguardando 15s..."
            sleep 15
          done

          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")
          for ARN in $LB_ARNS; do
            echo "  Forçando deleção: $ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" || true
          done

          if [ -n "$LB_ARNS" ]; then
            echo "Aguardando 90s para ENIs dos LBs serem liberadas..."
            sleep 90
          fi

          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" \
            --output text 2>/dev/null || echo "")
          for TG_ARN in $TG_ARNS; do
            echo "  Deletando target group: $TG_ARN"
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          done

      # ── 7. Remove SGs órfãos do LB Controller ────────────────────────────
      # O AWS LB Controller cria SGs fora do Terraform. Eles referenciam o
      # node SG (regras elbv2.k8s.aws/*) impedindo a exclusão da VPC.
      - name: Pre-destroy - delete orphaned LB Controller security groups
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC não encontrada — pulando limpeza de SGs."
            exit 0
          fi

          # Identifica SGs órfãos pelo padrão de nome do LB Controller
          ORPHAN_SGS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?starts_with(GroupName,'k8s-')].GroupId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$ORPHAN_SGS" ]; then
            echo "Nenhum SG órfão do LB Controller encontrado."
            exit 0
          fi

          # Remove regras cross-SG que referenciam os SGs órfãos do Node SG
          NODE_SG=$(aws ec2 describe-security-groups \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=tag:aws:eks:cluster-name,Values=${{ env.CLUSTER_NAME }}" \
            --query "SecurityGroups[?contains(GroupName,'node')].GroupId | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$NODE_SG" ] && [ "$NODE_SG" != "None" ]; then
            for ORPHAN_SG in $ORPHAN_SGS; do
              RULE_IDS=$(aws ec2 describe-security-group-rules \
                --filters "Name=group-id,Values=$NODE_SG" \
                --query "SecurityGroupRules[?ReferencedGroupInfo.GroupId=='$ORPHAN_SG'].SecurityGroupRuleId" \
                --output text 2>/dev/null || echo "")
              for RULE_ID in $RULE_IDS; do
                echo "  Removendo regra $RULE_ID do Node SG que referencia $ORPHAN_SG"
                aws ec2 revoke-security-group-ingress \
                  --group-id "$NODE_SG" \
                  --security-group-rule-ids "$RULE_ID" || true
              done
            done
          fi

          # Deleta os SGs órfãos
          for SG in $ORPHAN_SGS; do
            NAME=$(aws ec2 describe-security-groups --group-ids "$SG" \
              --query "SecurityGroups[0].GroupName" --output text 2>/dev/null || echo "?")
            echo "  Deletando SG órfão: $SG ($NAME)"
            aws ec2 delete-security-group --group-id "$SG" || true
          done

      # ── 8. Pré-deleta EKS node groups e aguarda término das instâncias ────
      # O problema raiz: Terraform destrói o node group e imediatamente tenta
      # deletar as subnets, mas as ENIs das instâncias EC2 ainda não foram
      # liberadas → DependencyViolation. Pré-deletando e aguardando, garantimos
      # que as ENIs estão liberadas quando o Terraform chegar na VPC.
      - name: Pre-destroy - delete EKS node groups and wait
        run: |
          NODE_GROUPS=$(aws eks list-nodegroups \
            --cluster-name "${{ env.CLUSTER_NAME }}" \
            --query "nodegroups[]" \
            --output text 2>/dev/null || echo "")

          if [ -z "$NODE_GROUPS" ]; then
            echo "Nenhum node group encontrado — pulando."
            exit 0
          fi

          for NG in $NODE_GROUPS; do
            echo "Deletando node group: $NG"
            aws eks delete-nodegroup \
              --cluster-name "${{ env.CLUSTER_NAME }}" \
              --nodegroup-name "$NG" 2>/dev/null || echo "  Já deletado ou erro ignorado."
          done

          echo "Aguardando deleção dos node groups (timeout: 30min)..."
          for NG in $NODE_GROUPS; do
            echo "  Aguardando: $NG"
            aws eks wait nodegroup-deleted \
              --cluster-name "${{ env.CLUSTER_NAME }}" \
              --nodegroup-name "$NG" 2>/dev/null || echo "  Node group $NG já inexistente."
          done

          echo "Todos os node groups deletados. ENIs das instâncias liberadas."

      # ── 9. Remove recursos Kubernetes/Helm do Terraform state ────────────
      # Quando os node groups são deletados no passo anterior, todos os pods
      # morrem — incluindo controllers (LB Controller, EBS CSI Driver, etc.).
      # Se o tofu destroy tentar destruir kubernetes_namespace ou helm_release,
      # o Kubernetes provider aguarda finalizers que nunca serão removidos
      # (controllers mortos) → context deadline exceeded.
      #
      # Solução: remover TODOS os recursos kubernetes_* e helm_release do state.
      # O tofu destroy opera apenas sobre recursos AWS (EKS, VPC, IAM, etc.),
      # que são destruídos via API sem depender dos controllers k8s.
      # O etcd (e todos os objetos k8s) é destruído junto com o control plane.
      - name: Remove Kubernetes and Helm resources from Terraform state
        run: |
          echo "Removendo recursos kubernetes_* e helm_release do state..."
          tofu state list 2>/dev/null \
            | grep -E '^(kubernetes_|helm_release\.|kubectl_manifest\.)' \
            | while read -r addr; do
                echo "  Removendo: $addr"
                tofu state rm "$addr" || true
              done

          echo "Removendo node groups deletados do state..."
          tofu state list 2>/dev/null \
            | grep 'aws_eks_node_group' \
            | while read -r addr; do
                echo "  Removendo: $addr"
                tofu state rm "$addr" || true
              done
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 10. Terraform Plan -destroy ───────────────────────────────────────
      - name: Terraform Plan (destroy)
        run: |
          tofu plan \
            -destroy \
            -var-file=terraform.tfvars.ci \
            -out=destroy.tfplan \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Publish destroy plan summary
        run: |
          {
            echo "### Recursos que serão DESTRUÍDOS — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo '```'
            grep -E "(#|will be destroyed|Plan:)" plan_output.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 11. Terraform Destroy ─────────────────────────────────────────────
      - name: Terraform Destroy
        run: tofu apply -auto-approve destroy.tfplan
        env:
          TF_VAR_postgres_admin_password:  ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Destroy completed
        run: |
          {
            echo "### Destroy concluído em $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Toda a infraestrutura foi removida."
          } >> "$GITHUB_STEP_SUMMARY"
